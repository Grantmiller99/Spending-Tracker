<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groceries - Owen's Spending Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-outer: #0A0A0A; 
            --bg-inner: #101010;
            --panel-bg: #161B22; 
            --border-color: #2D333B; 
            --text-main: #E6EDF3;
            --text-muted: #8B949E;
            --accent-green: #4ADE80; 
            --accent-blue: #60A5FA; 
            --accent-red: #F87171; 
            --sidebar-width: 240px;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-outer);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .main-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Left Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-inner);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .sidebar-logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s var(--ease-in-out), color 0.2s var(--ease-in-out);
        }

        .sidebar-menu-item i {
            width: 18px;
            text-align: center;
        }

        .sidebar-menu-item:hover, .sidebar-menu-item.active {
            background-color: #1F2937;
            color: var(--text-main);
        }

        .sidebar-menu-item.active {
            font-weight: 600;
            border: 1px solid rgba(96, 165, 250, 0.2);
            box-shadow: 0 0 10px rgba(96, 165, 250, 0.1);
        }

        /* Main Content Area */
        .content-area {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        .main-dashboard-content {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .header {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Entry Panels */
        .panels-grid {
            display: grid;
            grid-template-columns: 1fr; /* Single column for a wider grocery list */
            gap: 30px;
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 25px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            color: var(--text-main);
        }

        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            padding: 5px;
            transition: color 0.2s var(--ease-in-out);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-btn:hover {
            color: var(--accent-red);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"], input[type="number"], input[type="date"] {
            flex: 1;
            background-color: #1A1A1A;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            transition: border-color 0.2s var(--ease-in-out);
        }

        input[type="date"] { flex: 0.5; }
        input[type="number"] { flex: 0.5; }
        input[type="text"] { flex: 2; }

        ::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.6;
            cursor: pointer;
        }

        input:focus {
            outline: none;
            border-color: rgba(96, 165, 250, 0.5);
            box-shadow: 0 0 10px rgba(96, 165, 250, 0.1);
        }

        button.neon-btn {
            background-color: var(--bg-inner);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button.neon-btn:hover {
            background-color: #1F2937;
            border-color: rgba(96, 165, 250, 0.4);
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="sidebar">
            <div class="sidebar-logo"><i class="fas fa-coins"></i> Owen's Tracker</div>
            <a href="dashboard.html" class="sidebar-menu-item"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="entries.html" class="sidebar-menu-item"><i class="fas fa-list"></i> Entries</a>
            <a href="grocery.html" class="sidebar-menu-item"><i class="fas fa-shopping-cart"></i> Groceries</a>
            
            <div style="margin-top: auto;">
                <a href="settings.html" class="sidebar-menu-item"><i class="fas fa-cog"></i> Settings</a>
            </div>
        </div>

        <div class="content-area">
            
            <div class="main-dashboard-content">
                
                <div class="header">
                    <h1>Grocery Tracker</h1>
                </div>

                <div class="panels-grid">
                    
                    <div class="panel">
                        <div class="panel-header">
                            <h2>Weekly Grocery Bills</h2>
                        </div>
                        
                        <form class="input-group" id="grocery-form">
                            <input type="date" id="gro-date" required>
                            <input type="number" id="gro-amount" placeholder="Total Bill ($)" step="0.01" min="0.01" required>
                            <input type="text" id="gro-notes" placeholder="Notes (e.g., Week 1, Walmart, bulk rice)" required>
                            <button type="submit" class="neon-btn"><i class="fas fa-plus"></i> Add Bill</button>
                        </form>

                        <table>
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Total Amount</th>
                                    <th>Notes</th>
                                    <th style="width: 30px;"></th> 
                                </tr>
                            </thead>
                            <tbody id="grocery-table-body">
                                <!-- JS populated -->
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="store.js"></script>
    <script>
        let db = TrackerStore.load();
        let moneyFormatter = TrackerStore.formatter(db);

        TrackerStore.markActiveNav();

        function renderGroceries() {
            moneyFormatter = TrackerStore.formatter(db);
            const groceryLimit = db.settings.weekly_grocery_limit;
            const tbody = document.getElementById('grocery-table-body');
            tbody.innerHTML = '';

            const rows = [...db.grocery_entries]
                .sort((a, b) => TrackerStore.parseDate(b.date) - TrackerStore.parseDate(a.date));

            if (rows.length === 0) {
                const tr = document.createElement('tr');
                tr.innerHTML = '<td colspan="4" style="color: var(--text-muted); text-align: center; padding: 18px;">No grocery bills yet.</td>';
                tbody.appendChild(tr);
                return;
            }

            rows.forEach(entry => {
                const tr = document.createElement('tr');

                const dateCell = document.createElement('td');
                dateCell.textContent = entry.date;

                // Over the weekly limit shows red, under shows green.
                const amountCell = document.createElement('td');
                amountCell.textContent = moneyFormatter.format(entry.amount);
                amountCell.style.cssText = 'font-weight: 600; color: ' +
                    (entry.amount > groceryLimit ? 'var(--accent-red)' : 'var(--accent-green)') + ';';

                const notesCell = document.createElement('td');
                notesCell.textContent = entry.notes;

                const actionCell = document.createElement('td');
                const btn = document.createElement('button');
                btn.className = 'delete-btn';
                btn.innerHTML = '<i class="fas fa-trash"></i>';
                btn.addEventListener('click', () => {
                    if (!confirm("Are you sure you want to delete this grocery entry?")) return;
                    try {
                        db = TrackerStore.deleteEntry('grocery', entry.id);
                    } catch (err) {
                        alert(err.message);
                        return;
                    }
                    renderGroceries();
                });
                actionCell.appendChild(btn);

                tr.appendChild(dateCell);
                tr.appendChild(amountCell);
                tr.appendChild(notesCell);
                tr.appendChild(actionCell);
                tbody.appendChild(tr);
            });
        }

        document.getElementById('grocery-form').addEventListener('submit', function (e) {
            e.preventDefault();
            try {
                db = TrackerStore.addEntry('grocery', {
                    date: document.getElementById('gro-date').value,
                    amount: document.getElementById('gro-amount').value,
                    notes: document.getElementById('gro-notes').value
                });
            } catch (err) {
                alert(err.message);
                return;
            }
            this.reset();
            renderGroceries();
        });

        // Stay in sync if another tab clears or imports data
        TrackerStore.subscribe(function (fresh) {
            db = fresh;
            renderGroceries();
        });

        renderGroceries();
    </script>

</body>
</html>
